[project]
name = "medical-rag-telegram-bot"
version = "0.1.0"
description = "Telegram bot that answers medical questions only from your own PDFs (MCP + hybrid retrieval + LLM)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openai>=3.40.0",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.8",
    "rank-bm25>=0.2.2",
]
